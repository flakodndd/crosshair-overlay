<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Closing</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #0a0a0f;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #fff;
      overflow: hidden;
      user-select: none;
    }

    canvas#bg {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
    }

    .content {
      z-index: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      opacity: 0;
      animation: fadeIn 0.3s ease 0.1s forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .ring-container {
      width: 72px; height: 72px;
      position: relative;
      margin-bottom: 20px;
    }

    .ring-container svg {
      width: 100%; height: 100%;
      animation: rotateRing 2s linear infinite;
    }

    @keyframes rotateRing {
      to { transform: rotate(360deg); }
    }

    .ring-container .center-dot {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 12px; height: 12px;
      background: #818cf8;
      border-radius: 50%;
      animation: dotPulse 1s ease-in-out infinite;
      box-shadow: 0 0 20px rgba(129, 140, 248, 0.5);
    }

    @keyframes dotPulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
      50% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
    }

    .status {
      font-size: 13px;
      color: #9ca3af;
      letter-spacing: 0.3px;
      margin-bottom: 16px;
      opacity: 0;
      animation: fadeSlideUp 0.4s ease 0.3s forwards;
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .progress-container {
      width: 140px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      opacity: 0;
      animation: fadeSlideUp 0.4s ease 0.4s forwards;
    }

    .progress-track {
      width: 100%; height: 3px;
      background: rgba(255,255,255,0.06);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6366f1, #818cf8, #a5b4fc);
      border-radius: 2px;
      animation: fillBar 1.2s ease 0.5s forwards;
      position: relative;
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      right: 0; top: -1px;
      width: 6px; height: 5px;
      background: #c4b5fd;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(196, 181, 253, 0.6);
    }

    @keyframes fillBar {
      to { width: 100%; }
    }

    .bye {
      font-size: 10px;
      color: #4b5563;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeSlideUp 0.3s ease 1s forwards;
    }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>

  <div class="content">
    <div class="ring-container">
      <svg viewBox="0 0 72 72" fill="none">
        <circle cx="36" cy="36" r="30" stroke="rgba(99,102,241,0.15)" stroke-width="1.5" />
        <path d="M36 6 A30 30 0 0 1 66 36" stroke="#6366f1" stroke-width="2" stroke-linecap="round" />
        <path d="M66 36 A30 30 0 0 1 36 66" stroke="#818cf8" stroke-width="2" stroke-linecap="round" opacity="0.6" />
      </svg>
      <div class="center-dot"></div>
    </div>
    <div class="status" id="statusText">Saving your settings...</div>
    <div class="progress-container">
      <div class="progress-track">
        <div class="progress-fill"></div>
      </div>
    </div>
    <div class="bye">See you next time</div>
  </div>

  <script>
    const cv = document.getElementById('bg');
    const cx = cv.getContext('2d');
    let pts = [];

    function resize() {
      cv.width = innerWidth;
      cv.height = innerHeight;
    }
    resize();
    addEventListener('resize', resize);

    class P {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * cv.width;
        this.y = Math.random() * cv.height;
        this.size = Math.random() * 1.5 + 0.3;
        this.vx = (Math.random() - 0.5) * 0.15;
        this.vy = -Math.random() * 0.3 - 0.05;
        this.opacity = Math.random() * 0.3 + 0.05;
        this.hue = 230 + Math.random() * 30;
        this.life = 1;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= 0.002;
        if (this.life <= 0 || this.y < -10 || this.x < -10 || this.x > cv.width + 10) {
          this.reset();
          this.y = cv.height + 5;
        }
      }
      draw() {
        cx.beginPath();
        cx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        cx.fillStyle = `hsla(${this.hue}, 70%, 70%, ${this.opacity * this.life})`;
        cx.fill();
      }
    }

    for (let i = 0; i < 35; i++) pts.push(new P());

    (function loop() {
      cx.clearRect(0, 0, cv.width, cv.height);
      pts.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(loop);
    })();

    const msgs = ['Saving your settings...', 'Almost done...'];
    let idx = 0;
    setInterval(() => {
      idx = Math.min(idx + 1, msgs.length - 1);
      const el = document.getElementById('statusText');
      if (el) el.textContent = msgs[idx];
    }, 700);
  </script>
</body>
</html>
