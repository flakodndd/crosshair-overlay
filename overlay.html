<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval'; img-src 'self' data:;" />
    <title>Crosshair Overlay</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root {
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      @keyframes overlay-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
      @keyframes overlay-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
      @keyframes overlay-fade { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
      @keyframes overlay-rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes overlay-scale { 0%, 100% { transform: scale(1); } 50% { transform: scale(0.7); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/overlay.tsx"></script>
  </body>
</html>
